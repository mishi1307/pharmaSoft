spring:
  application:
    name: PharmaBackend
  profiles:
    active: dev

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
